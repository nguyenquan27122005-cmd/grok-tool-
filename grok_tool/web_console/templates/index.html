<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reg Control Plane</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23229ed9'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 16.5 13.2 20.5 23 10.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/css/style.css?v=1.4" />
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') document.documentElement.classList.add('dark-theme');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><i></i><i></i></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div class="brand-text">
          <strong>Reg Plane</strong>
          <span>Multi-tool console</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/register" data-route="#/register" class="nav-item is-active">
          <span class="nav-ico">▶</span><span>Đăng ký</span>
        </a>
        <a href="#/results" data-route="#/results" class="nav-item">
          <span class="nav-ico">▣</span><span>Kết quả</span>
        </a>
        <a href="#/logs" data-route="#/logs" class="nav-item">
          <span class="nav-ico">≡</span><span>Logs</span>
        </a>
        <a href="#/settings" data-route="#/settings" class="nav-item">
          <span class="nav-ico">⚙</span><span>Cài đặt</span>
        </a>
        <a href="#/tools" data-route="#/tools" class="nav-item">
          <span class="nav-ico">⬡</span><span>Tools</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="run-pill" id="run-pill">
          <i class="dot"></i>
          <span id="run-pill-text">Idle</span>
        </div>
        <div class="version">v1.0 · multi-tool</div>
      </div>
    </aside>

    <button class="mobile-menu" id="mobile-menu" type="button" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="page-eyebrow">Task Console</p>
          <h1 id="page-title">Đăng ký</h1>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="theme-toggle-btn" type="button" title="Đổi theme">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>
      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js?v=1.5"></script>
</body>
</html>
